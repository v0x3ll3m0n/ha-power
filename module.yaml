# The one manifest for both halves of this module (ADR-20260911-4p6 rule 30): the Go
# process in main.go and the browser bundle under ui/.
#
# It turns each printer's smart plug on and off through a Home Assistant
# `switch.*` entity. The process holds the Home Assistant address and token and
# makes every call to Home Assistant. The bundle only draws the toggle and asks
# this module's own routes, so the token never reaches a browser.
#
# The namespace is absent on purpose. The host derives it from the module path
# the operator installed (ADR-20260911-4p6 rule 15).

name: ha-power
title: Home Assistant power switch
summary: Turns each printer's Home Assistant smart plug on and off from the printer card and page, and refuses power off during a print or while the nozzle is hot.
codeowner: v0x3ll3m0n
# The kind gives the service runtime, as in examples/spools. The browser half
# rides in the same declaration as `service.assets`.
kind: sink
version: 0.1.2
# The same license as Prusa Connect itself, as every module in this tree
# carries it (see LICENSE).
license: OCL v1.1 + Micro v1 + NoSaaS v1 + SWAtt v1
# The plugin wire major the process half speaks.
contract_major: 1
# Where the fragment describing the routes is, inside this repository.
openapi: openapi.json
# The Raspberry Pi 5 that runs Prusa Connect Local is linux_arm64. The others
# are here so the module can also be tried on a desktop.
platforms:
  - linux_arm64
  - linux_amd64
  - darwin_arm64

options:
  - key: ha_url
    type: url
    required: true
    summary: The address of Home Assistant, with its port. Use a host or an IP address the server can reach.
  - key: ha_token
    type: secret
    required: true
    summary: A Home Assistant long-lived access token. Create it for a dedicated user that is not an administrator.
  - key: switches
    type: object
    default: "{}"
    summary: 'Which Home Assistant entity powers which printer, as JSON: {"<device id>": "switch.mk4_plug"}. The device id is the Printer UUID shown on the Printers tab of the web app. A printer that is not listed has no toggle.'

# The Prusa Connect versions this release runs on. 0.1.0-beta.1 is the first
# that reads `license`, and it is the core this module is built against.
require:
  core: ">=0.1.0-beta.1"

# The Home Assistant address is one the operator writes, so the manifest names
# the option and not a host. The process is the only place that connects.
egress:
  - option: ha_url
    # 8123 is Home Assistant's own port. 443 and 80 are for a Home Assistant
    # behind a reverse proxy.
    ports: [8123, 443, 80]
    from: process
    why: Reads the state of a plug and turns it on or off.
    sends: The long-lived access token and the id of one plug from the switches setting, only to the address in ha_url. Nothing else leaves the server.

# No `permissions` key: this module takes nothing as itself. It only asks the
# host what a person may do, and asking is a check (ADR-20261106-jnb). The
# module asks whether the person may observe a printer before it reads that
# printer's plug, and whether they may operate it before it switches the plug.
# A person who may only view a printer can read its state but cannot switch it.
#
# The host also takes view_resource on the instance before
# GET /power/{device} and operate_resource before POST /power/{device}, which
# openapi.json states on each operation. That says a person may use the module,
# and the two checks say which printers they may use it on.
checks:
  - observe
  - operate

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    device_card:
      - id: power
        title: Power
    device_section:
      - id: power
        title: Power
